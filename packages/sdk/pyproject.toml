[project]
name = "runledger-sdk"
version = "0.7.0"
description = "RunLedger SDK — instrument LangChain, LangGraph, OpenAI, and Anthropic agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "RunLedger" }]
keywords = ["runledger", "llm", "observability", "finops", "agents", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
langchain = ["langchain-core>=0.3.0"]
langgraph = ["langchain-core>=0.3.0", "langgraph>=0.2.0"]
cli = ["typer>=0.12.0", "rich>=13.0.0"]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-genai>=0.8.0"]
mistral = ["mistralai>=1.0.0"]
cohere = ["cohere>=5.0.0"]
mcp = ["mcp>=1.9.0"]
otel = ["opentelemetry-sdk>=1.20.0"]
all = ["runledger-sdk[openai,langchain,langgraph,cli,anthropic,gemini,mistral,cohere,mcp,otel]"]

[project.urls]
Homepage = "https://github.com/avs6/runledger-community"
Source = "https://github.com/avs6/runledger-community/tree/master/packages/sdk"
Changelog = "https://github.com/avs6/runledger-community/blob/master/packages/sdk/CHANGELOG.md"

[project.scripts]
runledger = "runledger_sdk.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["runledger_sdk", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["runledger_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]
