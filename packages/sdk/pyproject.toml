[project]
name = "runledger-sdk"
version = "0.5.0"
description = "RunLedger SDK — instrument LangChain, LangGraph, OpenAI, and Anthropic agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
langchain = ["langchain-core>=0.3.0"]
langgraph = ["langchain-core>=0.3.0", "langgraph>=0.2.0"]
cli = ["typer>=0.12.0", "rich>=13.0.0"]
anthropic = ["anthropic>=0.40.0"]
mcp = ["mcp>=1.9.0"]
all = ["runledger-sdk[openai,langchain,langgraph,cli,anthropic,mcp]"]

[project.scripts]
runledger = "runledger_sdk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]
