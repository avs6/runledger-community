# RunLedger — single, self-contained stack.
#
#   Run with published images:   docker compose up -d
#   Build from source instead:   docker compose up -d --build
#
# First-time setup (after `up`):
#   curl -X POST http://localhost:8201/admin/bootstrap \
#     -H "X-Admin-Secret: $ADMIN_SECRET" \
#     -H "Content-Type: application/json" \
#     -d '{"email":"admin@example.com","password":"Admin123!","full_name":"Admin","org_name":"My Org"}'
#
# Ports are namespaced so RunLedger never clashes with other local products:
#   Dashboard:        http://localhost:3201
#   API / docs:       http://localhost:8201  (/reference)
#   Qdrant:           http://localhost:8202
#   Embedding svc:    http://localhost:8204
#   Semantic cache:   http://localhost:8205
#   MCP gateway:      http://localhost:8206
#   OTLP HTTP/gRPC:   http://localhost:4318 / 4317   (standard OTLP ports)
#
# Local LLM runtimes (Ollama / vLLM) are external — set OLLAMA_BASE_URL / VLLM_BASE_URL in .env.
# All containers are named runledger-<service>.

name: runledger

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  runledger-postgres:
    image: postgres:16-alpine
    container_name: runledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: runledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runledger}
      POSTGRES_DB: runledger
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  runledger-redis:
    image: redis:7-alpine
    container_name: runledger-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  runledger-qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: runledger-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-8202}:6333"
      - "${QDRANT_GRPC_PORT:-8203}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RunLedger API ──────────────────────────────────────────────────────────

  runledger-api:
    image: abijith13/runledger-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: runledger-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8201}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://runledger:${POSTGRES_PASSWORD:-runledger}@runledger-postgres:5432/runledger
      REDIS_URL: redis://runledger-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars}
      ADMIN_SECRET: ${ADMIN_SECRET:-runledger-admin}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Allow both hostnames the dashboard is commonly opened at. If you browse the UI
      # from another host (a LAN IP, a machine name), add it here (comma-separated).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3201,http://127.0.0.1:3201}
      RUNLEDGER_BASE_URL: ${RUNLEDGER_BASE_URL:-http://localhost:8000}
      RUNLEDGER_API_KEY: ${RUNLEDGER_API_KEY:-}
      # License key — required for enterprise features (SSO, warehouse, etc.)
      RUNLEDGER_MODE: ${RUNLEDGER_MODE:-oss}
      RUNLEDGER_LICENSE_KEY: ${RUNLEDGER_LICENSE_KEY:-}
      RUNLEDGER_LICENSE_SIGNING_KEY: ${RUNLEDGER_LICENSE_SIGNING_KEY:-}
      # Optimization layer
      QDRANT_URL: http://runledger-qdrant:6333
      EMBEDDING_SVC_URL: http://runledger-embedding-svc:8100
      SEMANTIC_CACHE_SVC_URL: http://runledger-semantic-cache-svc:8101
      CONTEXT_COMPILER_SVC_URL: http://runledger-context-compiler:8103
      ROUTER_SVC_URL: http://runledger-router:8105
      MEMORY_SVC_URL: http://runledger-memory-svc:8107
      KG_SVC_URL: http://runledger-kg-svc:8106
      FLYWHEEL_SVC_URL: http://runledger-flywheel:8109
      # External local-LLM runtimes (Ollama on the host / a remote vLLM) — OpenAI-compatible
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2:3b}
      # Optional: transactional email via Brevo
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3201}
      # Optional: Firebase social login
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # Optional: Stripe payments
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      # Optional: GitHub-backed prompt storage
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_PROMPTS_REPO: ${GITHUB_PROMPTS_REPO:-}
    volumes:
      - ./logs:/app/logs
      # Provider pricing — edit config/pricing.yml then restart api + beat to apply
      - ./config:/app/config:ro
    # Lets the gateway reach an Ollama/vLLM server on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      runledger-postgres:
        condition: service_healthy
      runledger-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Celery Worker (event pipeline, metering, rollups, optimizer jobs) ──────

  runledger-worker:
    image: abijith13/runledger-worker:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: runledger-worker
    restart: unless-stopped
    command: celery -A runledger_api.core.celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://runledger:${POSTGRES_PASSWORD:-runledger}@runledger-postgres:5432/runledger
      REDIS_URL: redis://runledger-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars}
      ADMIN_SECRET: ${ADMIN_SECRET:-runledger-admin}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUNLEDGER_MODE: ${RUNLEDGER_MODE:-oss}
      RUNLEDGER_LICENSE_KEY: ${RUNLEDGER_LICENSE_KEY:-}
      RUNLEDGER_LICENSE_SIGNING_KEY: ${RUNLEDGER_LICENSE_SIGNING_KEY:-}
      QDRANT_URL: http://runledger-qdrant:6333
      EMBEDDING_SVC_URL: http://runledger-embedding-svc:8100
      SEMANTIC_CACHE_SVC_URL: http://runledger-semantic-cache-svc:8101
      CONTEXT_COMPILER_SVC_URL: http://runledger-context-compiler:8103
      ROUTER_SVC_URL: http://runledger-router:8105
      MEMORY_SVC_URL: http://runledger-memory-svc:8107
      KG_SVC_URL: http://runledger-kg-svc:8106
      FLYWHEEL_SVC_URL: http://runledger-flywheel:8109
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2:3b}
    volumes:
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      runledger-postgres:
        condition: service_healthy
      runledger-redis:
        condition: service_healthy

  # ── Celery Beat (periodic tasks: rollups, alerts, health checks) ───────────

  runledger-beat:
    image: abijith13/runledger-beat:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: runledger-beat
    restart: unless-stopped
    command: celery -A runledger_api.core.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://runledger:${POSTGRES_PASSWORD:-runledger}@runledger-postgres:5432/runledger
      REDIS_URL: redis://runledger-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars}
      ADMIN_SECRET: ${ADMIN_SECRET:-runledger-admin}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUNLEDGER_MODE: ${RUNLEDGER_MODE:-oss}
      RUNLEDGER_LICENSE_KEY: ${RUNLEDGER_LICENSE_KEY:-}
      RUNLEDGER_LICENSE_SIGNING_KEY: ${RUNLEDGER_LICENSE_SIGNING_KEY:-}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      runledger-postgres:
        condition: service_healthy
      runledger-redis:
        condition: service_healthy

  # ── Dashboard (Next.js) ───────────────────────────────────────────────────

  runledger-web:
    image: abijith13/runledger-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Browser-facing API URL — baked in at build time
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8201}
    container_name: runledger-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3201}:3000"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3201}
      NEXTAUTH_SECRET: ${SECRET_KEY:-change-me-in-production-32chars}
      # Internal Docker network URL — never seen by the browser
      API_URL: http://runledger-api:8000
    depends_on:
      runledger-api:
        condition: service_healthy

  # ── Optimization services ──────────────────────────────────────────────────

  runledger-embedding-svc:
    build:
      context: ./apps/embedding-svc
    container_name: runledger-embedding-svc
    restart: unless-stopped
    ports:
      - "${EMBEDDING_PORT:-8204}:8100"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      - embedding_cache:/app/.cache/fastembed
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  runledger-semantic-cache-svc:
    build:
      context: ./apps/semantic-cache-svc
    container_name: runledger-semantic-cache-svc
    restart: unless-stopped
    ports:
      - "${SEMANTIC_CACHE_PORT:-8205}:8101"
    environment:
      QDRANT_URL: http://runledger-qdrant:6333
      EMBEDDING_SVC_URL: http://runledger-embedding-svc:8100
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    depends_on:
      runledger-qdrant:
        condition: service_healthy
      runledger-embedding-svc:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8101/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runledger-mcp-gateway:
    build:
      context: ./apps/mcp-gateway
    container_name: runledger-mcp-gateway
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8206}:8200"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8200
      CONTEXT_COMPILER_SVC_URL: http://runledger-context-compiler:8103
      ROUTER_SVC_URL: http://runledger-router:8105
      MEMORY_SVC_URL: http://runledger-memory-svc:8107
      KG_SVC_URL: http://runledger-kg-svc:8106
      FLYWHEEL_SVC_URL: http://runledger-flywheel:8109
      SKILL_REGISTRY_URL: http://runledger-skill-registry:8108

  # ── Cognitive layer (Phase 5) ────────────────────────────────────────────
  # runledger-memory-db is a SEPARATE Postgres+pgvector for Letta — distinct from the
  # control-plane runledger-postgres (plain Postgres 16).

  runledger-memory-db:
    image: pgvector/pgvector:pg16
    container_name: runledger-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      - memory_db_data:/var/lib/postgresql/data
      # Enable pgvector on first init so Letta's migrations succeed.
      - ./infra/memory-db-init.sql:/docker-entrypoint-initdb.d/00-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 5s
      timeout: 5s
      retries: 10

  runledger-letta:
    image: letta/letta:latest
    container_name: runledger-letta
    restart: unless-stopped
    ports:
      - "${LETTA_PORT:-8214}:8283"
    environment:
      LETTA_PG_URI: postgresql://letta:letta@runledger-memory-db:5432/letta
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      runledger-memory-db:
        condition: service_healthy

  runledger-memory-svc:
    build:
      context: ./apps/memory-svc
    container_name: runledger-memory-svc
    restart: unless-stopped
    ports:
      - "${MEMORY_PORT:-8211}:8107"
    environment:
      LETTA_BASE_URL: http://runledger-letta:8283
      LETTA_MODEL: ${LETTA_MODEL:-ollama/llama3.1:8b}
      # Local text embedding model for memory (configurable — any model you've pulled in Ollama).
      EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${MEMORY_EMBEDDING_DIM:-768}
      OLLAMA_EMBED_ENDPOINT: ${OLLAMA_EMBED_ENDPOINT:-http://host.docker.internal:11434/v1}
    depends_on:
      - runledger-letta

  runledger-kg-svc:
    build:
      context: ./apps/kg-svc
    container_name: runledger-kg-svc
    restart: unless-stopped
    ports:
      - "${KG_PORT:-8212}:8106"
    volumes:
      - kuzu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8106/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runledger-skill-registry:
    build:
      context: ./apps/skill-registry
    container_name: runledger-skill-registry
    restart: unless-stopped
    ports:
      - "${SKILL_PORT:-8213}:8108"
    volumes:
      - skills_data:/data/skills

  runledger-reranker:
    build:
      context: ./apps/reranker-svc
    container_name: runledger-reranker
    restart: unless-stopped
    ports:
      - "${RERANKER_PORT:-8208}:8102"
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-flashrank}
    volumes:
      - reranker_cache:/app/.cache/fastembed
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8102/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  runledger-compression:
    build:
      context: ./apps/compression-svc
    container_name: runledger-compression
    restart: unless-stopped
    ports:
      - "${COMPRESSION_PORT:-8209}:8104"
    environment:
      COMPRESSION_MODEL: ${COMPRESSION_MODEL:-bert-base-multilingual}
    volumes:
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8104/health')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  runledger-router:
    build:
      context: ./apps/router-svc
    container_name: runledger-router
    restart: unless-stopped
    ports:
      - "${ROUTER_PORT:-8210}:8105"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      ROUTER_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8105/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runledger-context-compiler:
    build:
      context: ./apps/context-compiler-svc
    container_name: runledger-context-compiler
    restart: unless-stopped
    ports:
      - "${CONTEXT_COMPILER_PORT:-8207}:8103"
    environment:
      RERANKER_SVC_URL: http://runledger-reranker:8102
      MEMORY_SVC_URL: http://runledger-memory-svc:8107
      SKILL_REGISTRY_URL: http://runledger-skill-registry:8108
      COMPRESSION_SVC_URL: http://runledger-compression:8104
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      COMPILER_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      runledger-reranker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8103/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runledger-flywheel:
    build:
      context: ./apps/flywheel-svc
    container_name: runledger-flywheel
    restart: unless-stopped
    ports:
      - "${FLYWHEEL_PORT:-8215}:8109"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8109/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── OTel Collector (OTLP receiver → RunLedger) ────────────────────────────
  # Send traces from any instrumented agent to http://localhost:4318 (HTTP) or :4317 (gRPC).

  runledger-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: runledger-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    configs:
      - source: otel_config
        target: /etc/otel/config.yaml
    ports:
      - "4317:4317"    # OTLP/gRPC
      - "4318:4318"    # OTLP/HTTP
      - "13133:13133"  # Health probe
    environment:
      RUNLEDGER_API_KEY: ${RUNLEDGER_API_KEY:-}
    depends_on:
      runledger-api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  embedding_cache:
  reranker_cache:
  memory_db_data:
  kuzu_data:
  skills_data:
  hf_cache:

configs:
  otel_config:
    content: |
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
          path: /
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
              cors:
                allowed_origins:
                  - "http://*"
                  - "https://*"
      processors:
        batch:
          timeout: 5s
          send_batch_size: 512
        memory_limiter:
          check_interval: 1s
          limit_mib: 256
          spike_limit_mib: 64
      exporters:
        otlphttp/runledger:
          endpoint: http://runledger-api:8000
          # RunLedger's /v1/traces accepts OTLP/JSON, not protobuf — without this the
          # exporter sends application/x-protobuf and the API rejects it with 415.
          encoding: json
          headers:
            Authorization: "Bearer $${env:RUNLEDGER_API_KEY}"
          tls:
            insecure: true
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 120s
        debug:
          verbosity: basic
      service:
        extensions: [health_check]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/runledger, debug]
