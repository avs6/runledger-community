# RunLedger Provider Pricing Configuration
# ──────────────────────────────────────────────────────────────────────────────
# All rates are in USD per 1 million tokens.
#
# How to update prices
# --------------------
#   1. Edit this file (provider/model/rates below)
#   2. docker compose restart api beat
#      The API syncs on startup; Beat re-syncs every 6 hours.
#
# How the sync works
# ------------------
#   - New model      → INSERT a new pricing row (effective from now)
#   - Price changed  → Old row closed (effective_to = now), new row inserted
#                      Historical cost data is preserved.
#   - Price unchanged → No-op (fully idempotent)
#
# Workspace-specific overrides (added via Settings > Provider Profiles in the
# dashboard) are never touched by this sync — they always take precedence.
#
# Custom / self-hosted models
# ---------------------------
#   Add a block for any provider/model not listed here.
#   The "provider" and "model" values must exactly match what your SDK sends.
#   For local inference with no cost, set both rates to 0.00.
#
# Fields
# ------
#   provider              string  e.g. openai, anthropic, google, ollama, vllm
#   model                 string  exact model identifier (case-sensitive)
#   input_per_1m          float   USD per 1 million input (prompt) tokens
#   output_per_1m         float   USD per 1 million output (completion) tokens
#   cached_input_per_1m   float   optional — USD per 1M cached prompt tokens
#                                 omit to default to 50% of input_per_1m

models:

  # ── OpenAI ──────────────────────────────────────────────────────────────────

  - provider: openai
    model: gpt-4o
    input_per_1m: 2.50
    output_per_1m: 10.00
    cached_input_per_1m: 1.25

  - provider: openai
    model: gpt-4o-mini
    input_per_1m: 0.15
    output_per_1m: 0.60
    cached_input_per_1m: 0.075

  - provider: openai
    model: gpt-4-turbo
    input_per_1m: 10.00
    output_per_1m: 30.00
    cached_input_per_1m: 5.00

  - provider: openai
    model: gpt-3.5-turbo
    input_per_1m: 0.50
    output_per_1m: 1.50

  - provider: openai
    model: o1
    input_per_1m: 15.00
    output_per_1m: 60.00
    cached_input_per_1m: 7.50

  - provider: openai
    model: o3-mini
    input_per_1m: 1.10
    output_per_1m: 4.40
    cached_input_per_1m: 0.55

  # ── Anthropic ───────────────────────────────────────────────────────────────

  - provider: anthropic
