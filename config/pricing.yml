# RunLedger Provider Pricing — curated starter catalog
# ──────────────────────────────────────────────────────────────────────────────
# Focused on the providers most deployments use: Ollama (local), OpenAI, Anthropic.
# Import it from the dashboard — Settings → Pricing → Import YAML — or it seeds
# nothing by default (fresh installs start empty; the DB is the source of truth
# once imported). For a broader catalogue (Google, Azure, Bedrock, Vertex, …) see
# config/pricing.example.yml.
#
# All rates are USD per 1 million tokens.
#
# Fields
# ------
#   provider              e.g. ollama, openai, anthropic
#   model                 exact model identifier your SDK sends (case-sensitive)
#   input_per_1m          USD per 1M input (prompt) tokens
#   output_per_1m         USD per 1M output (completion) tokens
#   cached_input_per_1m   optional — USD per 1M cached prompt tokens (else 50% of input)
#   tags                  optional freeform list — e.g. [reasoning, coding, embedding]
#   display_name          optional friendly label for the UI
#
# Import is idempotent: a changed price updates the row in place; unchanged = no-op.

models:

  # ── OpenAI (latest) ───────────────────────────────────────────────────────────
  - provider: openai
    model: gpt-4o
    display_name: GPT-4o
    input_per_1m: 2.50
    output_per_1m: 10.00
    cached_input_per_1m: 1.25
    tags: [chat, vision, flagship]

  - provider: openai
    model: gpt-4o-mini
    display_name: GPT-4o mini
    input_per_1m: 0.15
    output_per_1m: 0.60
    cached_input_per_1m: 0.075
    tags: [chat, cheap, fast]

  - provider: openai
    model: o3-mini
    display_name: OpenAI o3-mini
    input_per_1m: 1.10
    output_per_1m: 4.40
    cached_input_per_1m: 0.55
    tags: [reasoning, coding]

  - provider: openai
    model: o1
    display_name: OpenAI o1
    input_per_1m: 15.00
    output_per_1m: 60.00
    cached_input_per_1m: 7.50
    tags: [reasoning, frontier]

  # ── Anthropic (latest) ────────────────────────────────────────────────────────
  - provider: anthropic
    model: claude-opus-4-6
    display_name: Claude Opus 4
    input_per_1m: 15.00
    output_per_1m: 75.00
    tags: [reasoning, coding, frontier]

  - provider: anthropic
    model: claude-sonnet-4-6
    display_name: Claude Sonnet 4.6
    input_per_1m: 3.00
    output_per_1m: 15.00
    tags: [chat, coding, balanced]

  - provider: anthropic
    model: claude-haiku-4-5
    display_name: Claude Haiku 4.5
    input_per_1m: 0.80
    output_per_1m: 4.00
    tags: [chat, cheap, fast]

  # ── Ollama (local / self-hosted — $0, tracks tokens only) ─────────────────────
  # Use the exact name `ollama list` reports. Set rates to your GPU/infra cost if
  # you want to track self-hosted spend instead of $0.
  - provider: ollama
    model: llama3.1:8b
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: deepseek-r1:14b
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, reasoning]

  - provider: ollama
    model: deepseek-r1:8b
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, reasoning]

  - provider: ollama
    model: qwen2.5-coder:14b
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, coding]

  - provider: ollama
    model: qwen3.5:latest
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: qwen3.6:latest
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: gemma3:latest
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: gemma4:12b
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: dolphin3:latest
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: dolphin-llama3:latest
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  - provider: ollama
    model: llama2-uncensored:7b
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, chat]

  # Text embedding model — used by the cognitive-layer memory (Letta) for local
  # embeddings. Pull once: `ollama pull nomic-embed-text`
  - provider: ollama
    model: nomic-embed-text
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, embedding]

  - provider: ollama
    model: nomic-embed-text:latest
    input_per_1m: 0.00
    output_per_1m: 0.00
    tags: [local, embedding]
