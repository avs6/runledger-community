# Simulation pricing catalog
#
# This catalog is intentionally local-only. The full simulator imports this file
# into Provider Profiles and also uses it to compute synthetic run costs, so the
# dashboard can show realistic FinOps for Ollama without any cloud API keys.
#
# Values represent internal infrastructure cost per 1M tokens. Tune them to your
# own GPU, electricity, and hosting assumptions.

models:
  - provider: ollama
    model: llama3.1:8b
    display_name: Llama 3.1 8B (local)
    input_per_1m: 0.05
    output_per_1m: 0.10
    tags: [local, chat]

  - provider: ollama
    model: llama3.2
    display_name: Llama 3.2 (local)
    input_per_1m: 0.02
    output_per_1m: 0.04
    tags: [local, chat, fast]

  - provider: ollama
    model: llama3.2:3b
    display_name: Llama 3.2 3B (local)
    input_per_1m: 0.02
    output_per_1m: 0.04
    tags: [local, chat, fast]

  - provider: ollama
    model: deepseek-r1:14b
    display_name: DeepSeek-R1 14B (local)
    input_per_1m: 0.12
    output_per_1m: 0.24
    tags: [local, reasoning]

  - provider: ollama
    model: deepseek-r1:8b
    display_name: DeepSeek-R1 8B (local)
    input_per_1m: 0.06
    output_per_1m: 0.12
    tags: [local, reasoning]

  - provider: ollama
    model: qwen2.5-coder:14b
    display_name: Qwen2.5 Coder 14B (local)
    input_per_1m: 0.12
    output_per_1m: 0.24
    tags: [local, coding]

  - provider: ollama
    model: qwen3.5:latest
    display_name: Qwen 3.5 (local)
    input_per_1m: 0.05
    output_per_1m: 0.10
    tags: [local, chat]

  - provider: ollama
    model: gemma3:latest
    display_name: Gemma 3 (local)
    input_per_1m: 0.03
    output_per_1m: 0.06
    tags: [local, chat]

  - provider: ollama
    model: nomic-embed-text
    display_name: Nomic Embed Text (local)
    input_per_1m: 0.01
    output_per_1m: 0.00
    tags: [local, embedding]
