# Simulation pricing catalog
# ──────────────────────────────────────────────────────────────────────────────
# Used by the simulator (scripts/full_simulate.py): it imports this into the
# provider-pricing catalog AND uses it to compute the cost of each ingested run,
# so cost/analytics look real — including for **local Ollama models**.
#
# Unlike config/pricing.yml (where local models are $0), here Ollama models carry
# a small per-1M-token cost representing your GPU / electricity / infra spend, so
# you can actually track and attribute the cost of local inference. Tune the
# numbers to your hardware.
#
# Same format as config/pricing.yml - import it from the dashboard too if you like
# (Provider Profiles -> Import YAML).

models:

  # ── Ollama (local — priced at your infra cost so it's tracked) ────────────────
  - provider: ollama
    model: llama3.1:8b
    display_name: Llama 3.1 8B (local)
    input_per_1m: 0.05
    output_per_1m: 0.10
    tags: [local, chat]

  - provider: ollama
    model: llama3.2
    display_name: Llama 3.2 (local)
    input_per_1m: 0.02
    output_per_1m: 0.04
    tags: [local, chat, fast]

  - provider: ollama
    model: llama3.2:3b
    display_name: Llama 3.2 3B (local)
    input_per_1m: 0.02
    output_per_1m: 0.04
    tags: [local, chat, fast]

  - provider: ollama
    model: deepseek-r1:14b
    display_name: DeepSeek-R1 14B (local)
    input_per_1m: 0.12
    output_per_1m: 0.24
    tags: [local, reasoning]

  - provider: ollama
    model: deepseek-r1:8b
    display_name: DeepSeek-R1 8B (local)
    input_per_1m: 0.06
    output_per_1m: 0.12
    tags: [local, reasoning]

  - provider: ollama
    model: qwen2.5-coder:14b
    display_name: Qwen2.5 Coder 14B (local)
    input_per_1m: 0.12
    output_per_1m: 0.24
    tags: [local, coding]

  - provider: ollama
    model: qwen3.5:latest
    display_name: Qwen 3.5 (local)
    input_per_1m: 0.05
    output_per_1m: 0.10
    tags: [local, chat]

  - provider: ollama
    model: gemma3:latest
    display_name: Gemma 3 (local)
    input_per_1m: 0.03
    output_per_1m: 0.06
    tags: [local, chat]

  # Embeddings are cheap — output tokens are 0 for embedding models.
  - provider: ollama
    model: nomic-embed-text
    display_name: Nomic Embed Text (local)
    input_per_1m: 0.01
    output_per_1m: 0.00
    tags: [local, embedding]

  # ── OpenAI (hosted, for mixed / comparison scenarios) ─────────────────────────
  - provider: openai
    model: gpt-4o
    input_per_1m: 2.50
    output_per_1m: 10.00
    cached_input_per_1m: 1.25
    tags: [chat, flagship]

  - provider: openai
    model: gpt-4o-mini
    input_per_1m: 0.15
    output_per_1m: 0.60
    cached_input_per_1m: 0.075
    tags: [chat, cheap, fast]

  - provider: openai
    model: o3-mini
    input_per_1m: 1.10
    output_per_1m: 4.40
    tags: [reasoning, coding]

  # ── Anthropic (hosted) ────────────────────────────────────────────────────────
  - provider: anthropic
    model: claude-sonnet-4-6
    input_per_1m: 3.00
    output_per_1m: 15.00
    tags: [chat, coding, balanced]

  - provider: anthropic
    model: claude-haiku-4-5
    input_per_1m: 0.80
    output_per_1m: 4.00
    tags: [chat, cheap, fast]
