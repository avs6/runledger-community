[project]
name = "runledger"
version = "0.1.0"
description = "Agent FinOps Control Plane for AI agents"
readme = "README.md"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["apps/api", "packages/sdk"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # FastAPI Depends() in defaults is the standard pattern
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
