name: Build & Push Images

# Builds every RunLedger image in CI (review P-13) and pushes it to Docker Hub
# (docker.io/abijith13/runledger-<name>):
#   core          api (also runs workers and beat), web, gateway-rs
#   optimization  the microservices (infra/helm/runledger — optimization.imageRegistry)
#
# Tags are immutable: sha-<full git sha> on every build and <version> for a v* tag.
# Nothing is tagged "latest"; Helm and Compose pin a version (Chart appVersion /
# RUNLEDGER_TAG), so api, workers and beat always run the same build (cd:S-06).
#
# Requires two repo secrets:
#   DOCKERHUB_USERNAME  → abijith13
#   DOCKERHUB_TOKEN     → a Docker Hub access token (Account Settings → Security)

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: docker.io
  NAMESPACE: abijith13

jobs:
  # Only build/push when the Docker Hub secrets are configured. Without this gate the
  # workflow fails red on every push until the secrets exist; with it, it cleanly skips.
  gate:
    name: check-secrets
    runs-on: ubuntu-latest
    if: github.repository == 'avs6/runledger-community'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets not set — skipping image build/push. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable."
          fi

  core:
    name: core ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
          - name: gateway-rs
            context: apps/gateway-rs
            file: apps/gateway-rs/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/runledger-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNLEDGER_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-sha.{0}', github.sha) }}
            RUNLEDGER_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=core-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.name }}

  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - embedding-svc
          - semantic-cache-svc
          - reranker-svc
          - context-compiler-svc
          - compression-svc
          - router-svc
          - flywheel-svc
          - memory-svc
          - kg-svc
          - skill-registry
          - mcp-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/runledger-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
