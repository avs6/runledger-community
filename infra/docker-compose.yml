name: runledger

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runledger
      POSTGRES_PASSWORD: runledger
      POSTGRES_DB: runledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application ──────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://runledger:runledger@postgres:5432/runledger
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-runledger-admin}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000
      # MCP server (mounted at /mcp) calls back to itself via loopback
      RUNLEDGER_BASE_URL: http://localhost:8000
      RUNLEDGER_API_KEY: ${RUNLEDGER_API_KEY:-}
      # Brevo SMTP — set these in infra/.env to enable transactional email
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - ../logs:/app/logs
      # Provider pricing — edit config/pricing.yml then restart api + beat to apply
      - ../config/pricing.yml:/app/config/pricing.yml:ro
    # Allows the gateway to reach Ollama (or other host-based services) at
    # http://host.docker.internal:11434 on all platforms (Linux needs this extra_hosts entry;
    # Docker Desktop on Mac/Windows provides it automatically).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: celery -A runledger_api.core.celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://runledger:runledger@postgres:5432/runledger
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-runledger-admin}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    volumes:
      - ../config/pricing.yml:/app/config/pricing.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat scheduler — fires periodic tasks:
  # cost_enrichment (60s), hourly rollup (30m), daily rollup, anomaly detection
  beat:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: celery -A runledger_api.core.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://runledger:runledger@postgres:5432/runledger
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-runledger-admin}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    volumes:
      - ../config/pricing.yml:/app/config/pricing.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Must be the browser-facing URL — NEXT_PUBLIC_ vars are baked in at build time
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${SECRET_KEY:-dev-secret-key-change-in-production}
      # Server-side (SSR/RSC) API URL — internal Docker network, never seen by the browser
      API_URL: http://api:8000
    depends_on:
      - api

  # ── OTel Collector ────────────────────────────────────────────────────────
  # Always started as part of the default stack.
  # Applications send traces to localhost:4318 (HTTP) or localhost:4317 (gRPC).
  # The Collector batches and forwards them to RunLedger's /v1/traces endpoint.
  #
  # Set RUNLEDGER_API_KEY in infra/.env (copy from infra/.env.example).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
      - "13133:13133" # Health check probe
    environment:
      RUNLEDGER_API_KEY: ${RUNLEDGER_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
