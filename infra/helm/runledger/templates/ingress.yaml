{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "runledger.fullname" . }}-api
  labels:
    {{- include "runledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.hosts.api.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.api.host | quote }}
      secretName: {{ .Values.ingress.hosts.api.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.api.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "runledger.fullname" . }}-api
                port:
                  number: {{ .Values.service.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "runledger.fullname" . }}-web
  labels:
    {{- include "runledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.hosts.web.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.web.host | quote }}
      secretName: {{ .Values.ingress.hosts.web.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.web.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "runledger.fullname" . }}-web
                port:
                  number: {{ .Values.service.web.port }}
{{- end }}
