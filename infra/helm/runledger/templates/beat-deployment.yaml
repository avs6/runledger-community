apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runledger.fullname" . }}-beat
  labels:
    {{- include "runledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  # Always exactly 1 replica — multiple beat instances will fire duplicate scheduled tasks.
  replicas: 1
  selector:
    matchLabels:
      {{- include "runledger.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  strategy:
    # Recreate ensures only one beat pod runs at a time during deploys.
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/values: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "runledger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runledger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: beat
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - runledger_api.core.celery_app
            - beat
            - --loglevel=info
            - --scheduler=celery.beat.PersistentScheduler
          env:
            {{- include "runledger.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
