apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runledger.fullname" . }}-api
  labels:
    {{- include "runledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "runledger.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/values: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "runledger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runledger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "runledger_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "runledger.commonEnv" . | nindent 12 }}
            {{- if .Values.secrets.stripeSecretKey }}
            - name: STRIPE_SECRET_KEY
              {{ include "runledger.secretRef" (list . "STRIPE_SECRET_KEY" .Values.secrets.stripeSecretKey) }}
            - name: STRIPE_WEBHOOK_SECRET
              {{ include "runledger.secretRef" (list . "STRIPE_WEBHOOK_SECRET" .Values.secrets.stripeWebhookSecret) }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if .Values.pricingConfig.enabled }}
          volumeMounts:
            - name: pricing-config
              mountPath: /app/pricing.yml
              subPath: pricing.yml
              readOnly: true
          {{- end }}
      {{- if .Values.pricingConfig.enabled }}
      volumes:
        - name: pricing-config
          configMap:
            name: {{ .Values.pricingConfig.configMapName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
