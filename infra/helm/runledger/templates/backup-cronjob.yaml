{{- if .Values.backup.enabled }}
{{- $full := include "runledger.fullname" . }}
{{- $stores := .Values.backup.stores }}
{{- $mountKuzu := and .Values.optimization.enabled $stores.kuzu.enabled (index .Values.optimizationServices "kg").enabled }}
{{- $mountSkills := and .Values.optimization.enabled $stores.skills.enabled (index .Values.optimizationServices "skill-registry").enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $full }}-backup
  labels:
    {{- include "runledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "runledger.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "runledger.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999    # postgres user in postgres:16-alpine
            fsGroup: 999
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  {{ include "runledger.databaseUrl" . }}
                - name: MEMORY_DB_URL
                  value: {{ include "runledger.memoryDbUrl" . | quote }}
                - name: QDRANT_URL
                  value: {{ include "runledger.qdrantUrl" . | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3Bucket | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.awsRegion | quote }}
                - name: RETAIN_DAYS
                  value: {{ .Values.backup.retainDays | quote }}
                - name: BACKUP_MEMORY_DB
                  value: {{ $stores.memoryDb.enabled | quote }}
                - name: BACKUP_QDRANT
                  value: {{ $stores.qdrant.enabled | quote }}
                - name: BACKUP_KUZU
                  value: {{ $mountKuzu | quote }}
                - name: BACKUP_SKILLS
                  value: {{ $mountSkills | quote }}
              command:
                - /bin/sh
                - -ec
                - |
                  # postgres:16-alpine ships pg_dump; add the rest at runtime.
                  apk add --no-cache aws-cli curl tar >/dev/null

                  TS=$(date +%Y%m%dT%H%M%SZ)
                  PGCP="${DATABASE_URL/postgresql+asyncpg:/postgresql:}"

                  upload() {  # $1 = local file, $2 = s3 prefix
                    aws s3 cp "$1" "${S3_BUCKET}/$2/$(basename "$1")" --storage-class STANDARD_IA
                    echo "  uploaded ${S3_BUCKET}/$2/$(basename "$1")"
                  }

                  echo "[control-plane] pg_dump"
                  pg_dump "$PGCP" --format=custom --no-acl --no-owner --file="/tmp/runledger-${TS}.dump"
                  upload "/tmp/runledger-${TS}.dump" "control-plane"

                  if [ "$BACKUP_MEMORY_DB" = "true" ]; then
                    echo "[memory-db] pg_dump"
                    pg_dump "$MEMORY_DB_URL" --format=custom --no-acl --no-owner --file="/tmp/memory-${TS}.dump"
                    upload "/tmp/memory-${TS}.dump" "memory-db"
                  fi

                  if [ "$BACKUP_QDRANT" = "true" ]; then
                    echo "[qdrant] full snapshot"
                    SNAP=$(curl -sf -X POST "${QDRANT_URL}/snapshots" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
                    if [ -n "$SNAP" ]; then
                      curl -sf "${QDRANT_URL}/snapshots/${SNAP}" -o "/tmp/qdrant-${TS}.snapshot"
                      upload "/tmp/qdrant-${TS}.snapshot" "qdrant"
                      curl -sf -X DELETE "${QDRANT_URL}/snapshots/${SNAP}" >/dev/null || true
                    else
                      echo "  WARN: could not create Qdrant snapshot (skipping)"
                    fi
                  fi

                  if [ "$BACKUP_KUZU" = "true" ]; then
                    echo "[kuzu] tar PVC"
                    tar czf "/tmp/kuzu-${TS}.tar.gz" -C /backup/kuzu .
                    upload "/tmp/kuzu-${TS}.tar.gz" "kuzu"
                  fi

                  if [ "$BACKUP_SKILLS" = "true" ]; then
                    echo "[skills] tar PVC"
                    tar czf "/tmp/skills-${TS}.tar.gz" -C /backup/skills .
                    upload "/tmp/skills-${TS}.tar.gz" "skills"
                  fi

                  echo "[prune] removing backups older than ${RETAIN_DAYS} days"
                  CUTOFF=$(date -d "${RETAIN_DAYS} days ago" +%Y%m%d 2>/dev/null || date -v-${RETAIN_DAYS}d +%Y%m%d)
                  aws s3 ls "${S3_BUCKET}/" --recursive | awk '{print $4}' | while read -r f; do
                    fdate=$(echo "$f" | grep -oE '[0-9]{8}' | head -1)
                    if [ -n "$fdate" ] && [ "$fdate" -lt "$CUTOFF" ]; then
                      aws s3 rm "${S3_BUCKET}/${f}" && echo "  pruned ${f}"
                    fi
                  done
                  echo "Backup complete."
              {{- if or $mountKuzu $mountSkills }}
              volumeMounts:
                {{- if $mountKuzu }}
                - name: kuzu
                  mountPath: /backup/kuzu
                  readOnly: true
                {{- end }}
                {{- if $mountSkills }}
                - name: skills
                  mountPath: /backup/skills
                  readOnly: true
                {{- end }}
              {{- end }}
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          {{- if or $mountKuzu $mountSkills }}
          volumes:
            {{- if $mountKuzu }}
            # RWO single-attach: this job must land on the kg-svc pod's node, or the
            # PVC must be RWX. See docs/optimization/ha-and-backup.mdx.
            - name: kuzu
              persistentVolumeClaim:
                claimName: data-{{ $full }}-kg-0
            {{- end }}
            {{- if $mountSkills }}
            - name: skills
              persistentVolumeClaim:
                claimName: data-{{ $full }}-skill-registry-0
            {{- end }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
