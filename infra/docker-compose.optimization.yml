# Optimization-layer overlay (Phase 1).
#
# Compose alongside the base stack:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.optimization.yml up
#
# Local LLM runtimes (Ollama / vLLM) are NOT part of this suite. They run wherever you already
# host them (e.g. Ollama on the Windows host, or a vLLM server elsewhere). RunLedger only needs
# their OpenAI-compatible base URL — set OLLAMA_BASE_URL / VLLM_BASE_URL in infra/.env.
# From inside a container, the host is reachable at http://host.docker.internal:<port>.
#
# No HA / no backup yet (decision #10 — deferred to Phase 8). Local volumes only.

name: runledger

services:
  # ── Dedicated vector store ─────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optimization services ──────────────────────────────────────────────────

  embedding-svc:
    build:
      context: ../apps/embedding-svc
    ports:
      - "8100:8100"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      - embedding_cache:/app/.cache/fastembed
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  semantic-cache-svc:
    build:
      context: ../apps/semantic-cache-svc
    ports:
      - "8101:8101"
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SVC_URL: http://embedding-svc:8100
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    depends_on:
      qdrant:
        condition: service_healthy
      embedding-svc:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8101/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp-gateway:
    build:
      context: ../apps/mcp-gateway
    ports:
      - "8200:8200"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8200

  # ── Wire the new endpoints into the existing control plane ─────────────────
  # (overlay merges these env vars into the base-stack services)
  #
  # OLLAMA_BASE_URL / VLLM_BASE_URL point at EXTERNAL, self-hosted runtimes.
  # Defaults assume Ollama on the Docker host; override in infra/.env for a remote vLLM.

  api:
    environment:
      EMBEDDING_SVC_URL: http://embedding-svc:8100
      SEMANTIC_CACHE_SVC_URL: http://semantic-cache-svc:8101
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2:3b}

  worker:
    environment:
      EMBEDDING_SVC_URL: http://embedding-svc:8100
      SEMANTIC_CACHE_SVC_URL: http://semantic-cache-svc:8101
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2:3b}
    # Optimizer worker roles (P2+) call the local LLM on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
  embedding_cache:
